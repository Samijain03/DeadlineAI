services:
  - type: web
    name: deadlineai-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn deadline_ai.wsgi:application"
    healthCheckPath: /api/health/
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TIMEOUT_MS
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://deadlineai-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://deadlineai-frontend.onrender.com

  - type: web
    name: deadlineai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://deadlineai-backend-ktuw.onrender.com/api
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
